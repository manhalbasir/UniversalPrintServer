name: Cleanup bad file
on: workflow_dispatch
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CLEAN_TOKEN }}
      - name: Remove files with newline in name
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in *$'\n'*) echo "removing: $f"; git rm -q -- "$f";; esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove badly named file" || echo "nothing to remove"
          git push